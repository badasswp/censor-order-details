name: CensorOrderDetails Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Checkout to Master Built
        if: github.ref == 'refs/heads/master'
        env:
          USER_EMAIL: "badasswpdev@gmail.com"
          USER_NAME: "badasswp"
        run: |
          git config user.email "${USER_EMAIL}"
          git config user.name "${USER_NAME}"
          git checkout -b master-built

      - name: Clean Up Files
        run: |
          while IFS= read -r file; do
            git rm -rf "$file"
          done < .deployignore
          git rm .deployignore

      - name: Push to Master Built
        run: |
          git commit -m "push to master-built"
          git push origin master-built -f
          rm -rf .git

      - name: Deploy to Production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: wp-mst/wp-content/plugins/censor-order-details/
